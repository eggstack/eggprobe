[workspace]
members = [
    "crates/eggprobe-native",
    "crates/eggprobe-core",
    "crates/eggprobe-cli",
]
# C007 evidence-only Trippy reproducer crates. Each carries its own empty
# `[workspace]` table; the exclusion below states the isolation explicitly so
# these crates (including their Git dependencies) can never enter production
# dependency resolution or the ordinary `--workspace` verification matrix.
exclude = [
    "tools/repros/trippy-windows-1793/baseline",
    "tools/repros/trippy-windows-1793/candidate-fix",
    "tools/repros/trippy-windows-1793/candidate-master",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/eggstack/eggprobe"
homepage = "https://github.com/eggstack/eggprobe"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
url = "2.5"
webpki-roots = "0.26"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
