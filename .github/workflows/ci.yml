name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  msrv:
    name: MSRV (Rust 1.89.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --workspace --all-targets --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AUDIT_TOOLCHAIN: stable
      AUDIT_TOOL: cargo-audit
      AUDIT_TOOL_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@v4
      - name: Install audit toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        shell: bash
        run: |
          set -euo pipefail
          # The workspace's rust-toolchain.toml pins the product MSRV; the
          # audit tool's transitive dependencies require a newer compiler, so
          # install it with the explicit audit toolchain rather than the
          # workspace-default one. `--locked` enforces a reproducible
          # dependency graph; `--root "$CARGO_HOME"` ensures the proxy
          # binary lands where `cargo audit` will find it on PATH.
          cargo +"$AUDIT_TOOLCHAIN" install \
            "$AUDIT_TOOL" \
            --version "$AUDIT_TOOL_VERSION" \
            --locked \
            --root "$CARGO_HOME"
      - name: Record audit tool versions
        shell: bash
        run: |
          set -euo pipefail
          echo "rustc:  $(rustc +"$AUDIT_TOOLCHAIN" --version)"
          echo "cargo:  $(cargo +"$AUDIT_TOOLCHAIN" --version)"
          echo "$AUDIT_TOOL: $(cargo +"$AUDIT_TOOLCHAIN" audit --version)"
      - name: Run dependency audit
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$AUDIT_TOOLCHAIN" audit
