name: Release packages

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: Existing release tag, for example v0.1.0

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            smoke: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            smoke: false
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            smoke: true
          - target: aarch64-apple-darwin
            runner: macos-latest
            smoke: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            smoke: true
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          version_ref='${{ inputs.version }}'
          [[ "$version_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Prove tag and source authority
        shell: bash
        run: |
          set -euo pipefail
          version_ref='${{ inputs.version }}'
          [[ "$(git describe --tags --exact-match HEAD)" == "$version_ref" ]]
          package_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "eggprobe-cli") | .version')"
          tag_version="${version_ref#v}"
          [[ "$package_version" == "$tag_version" ]]
          printf 'tag=%s\ncommit=%s\npackage_version=%s\n' \
            "$version_ref" "$(git rev-parse HEAD)" "$package_version" \
            > release-identity.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native target
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build Linux aarch64 target
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: houseabsolute/actions-rust-cross@v0.0.3
        with:
          command: build
          target: ${{ matrix.target }}
          args: --locked --release

      - name: Inspect cross-built binary
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          file target/${{ matrix.target }}/release/eggprobe
          file target/${{ matrix.target }}/release/eggprobe | grep -Eqi 'aarch64|arm64'

      - name: Run host-native smoke
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          if [[ "$target" == *windows* ]]; then
            bin="target/$target/release/eggprobe.exe"
          else
            bin="target/$target/release/eggprobe"
          fi
          "$bin" --version
          "$bin" run <(printf '%s\n' '{"schema_version":"0.3","target":{"host":"127.0.0.1"},"route":{"kind":"direct"},"probes":[],"execution":{"deadline":1000000,"repetitions":1,"retries":0},"assertions":[]}') --ndjson > smoke.jsonl
          test "$(wc -l < smoke.jsonl | tr -d ' ')" = 1
          jq -e '.schema_version == "0.3" and .status == "ok" and .route.kind == "direct"' smoke.jsonl

      - name: Package and verify archive
        shell: bash
        run: |
          set -euo pipefail
          version_ref='${{ inputs.version }}'
          version="${version_ref#v}"
          target='${{ matrix.target }}'
          if [[ "$target" == *windows* ]]; then
            bin="target/$target/release/eggprobe.exe"
            archive="eggprobe-${version}-${target}.zip"
          else
            bin="target/$target/release/eggprobe"
            archive="eggprobe-${version}-${target}.tar.gz"
          fi
          staging="package/eggprobe-${version}-${target}"
          mkdir -p "$staging" dist
          cp "$bin" "$staging/"
          cp LICENSE README.md release-identity.txt "$staging/"
          if [[ "$target" == *windows* ]]; then
            (cd package && 7z a "../dist/$archive" "eggprobe-${version}-${target}")
          else
            tar -C package -czf "dist/$archive" "eggprobe-${version}-${target}"
          fi
          test -f "dist/$archive"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$archive" > "${archive}.sha256")
          else
            (cd dist && shasum -a 256 "$archive" > "${archive}.sha256")
          fi
          if [[ "$archive" == *.zip ]]; then
            7z t "dist/$archive"
          else
            tar -tzf "dist/$archive" >/dev/null
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c "${archive}.sha256")
          else
            (cd dist && shasum -a 256 -c "${archive}.sha256")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: eggprobe-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            release-identity.txt
