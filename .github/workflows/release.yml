name: Release packages

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: Release version/tag already checked out

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build native target
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Build Linux aarch64 target
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: houseabsolute/actions-rust-cross@v0.0.3
        with:
          command: build
          target: ${{ matrix.target }}
          args: --locked --release
      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dir="dist/eggprobe-${version}-${{ matrix.target }}"
          mkdir -p "$dir"
          if [[ "${{ matrix.target }}" == *windows* ]]; then bin="target/${{ matrix.target }}/release/eggprobe.exe"; else bin="target/${{ matrix.target }}/release/eggprobe"; fi
          cp "$bin" "$dir/"
          cp LICENSE README.md "$dir/"
          "$bin" --version
          if [[ "${{ matrix.target }}" == *windows* ]]; then (cd dist && 7z a "eggprobe-${version}-${{ matrix.target }}.zip" "eggprobe-${version}-${{ matrix.target }}"); else tar -C dist -czf "dist/eggprobe-${version}-${{ matrix.target }}.tar.gz" "eggprobe-${version}-${{ matrix.target }}"; fi
          (cd dist && sha256sum * > SHA256SUMS.txt || shasum -a 256 * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: eggprobe-${{ matrix.target }}
          path: dist/
